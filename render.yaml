services:
  - type: web
    name: varshaai-platform
    env: python
    buildCommand: "pip install -r requirements.txt && python ml_engine/train_models.py"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
